<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Paso a Paso</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paso a Paso">
<meta name="theme-color" content="#1d2747">
<meta name="app-version" content="paso-v6-48d536ca">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#1d2747; --panel:#27345e; --panel2:#33437a; --ink:#fff8ee; --muted:#b9c3e0;
  --accent:#ffb84d; --good:#5fd38d; --soft:#cdb4db; --blue:#7ec8e3; --pink:#ff8fab; --orange:#f4a261;
  --tile:#fdf6e7; --tileInk:#2a2420; --radius:20px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,"Noto Color Emoji",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none}
button:disabled{cursor:default}
#app{max-width:1100px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 18px;min-height:72px}
.topbar .title{font-size:24px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:16px;color:var(--muted);font-weight:600;margin-left:6px}
.chip{background:var(--panel2);border-radius:999px;padding:9px 14px;font-weight:700;font-size:18px;white-space:nowrap}
.en-chip{background:var(--blue);color:#10243a}
.btn{background:var(--accent);color:#2a1d05;border-radius:16px;padding:14px 22px;font-size:22px;font-weight:800;min-height:62px;min-width:62px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn.secondary{background:var(--panel2);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--muted);font-weight:600;box-shadow:none}
.btn.small{padding:10px 16px;min-height:52px;font-size:18px}
.btn:disabled{opacity:.45}
.btn.go{font-size:28px;padding:18px 34px;background:var(--good);color:#0c2a1b}
.btn:active,.tile-pic:active,.opt:active,.key:active,.wtile:active,.card:active,.lesson-dot:active{transform:scale(.96)}
.screen{flex:1;padding:6px 22px 26px;display:flex;flex-direction:column;gap:14px}
.screen.center{align-items:center;justify-content:center;text-align:center}
h1{font-size:34px;margin:4px 0}
h2{font-size:26px;margin:4px 0}
p{font-size:20px;line-height:1.45;margin:0}
.muted{color:var(--muted)}
.small-note{font-size:17px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.card{background:var(--panel);border-radius:var(--radius);padding:20px;text-align:left;display:flex;flex-direction:column;gap:8px}
.card .big{font-size:26px;font-weight:800}
.card .emoji{font-size:44px}
.big-choice{flex-direction:row;align-items:center;gap:18px}
.player-card{align-items:center;text-align:center;min-height:250px;justify-content:center;border:4px solid transparent}
.player-card .avatar{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#1d2b27}
.player-card .name{font-size:30px;font-weight:800}
.edit{font-size:18px;color:var(--muted);padding:10px 14px;background:var(--panel2);border-radius:12px;min-height:48px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.progress{height:12px;background:var(--panel2);border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:var(--good);transition:width .4s}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:center;margin-top:6px;padding:10px 0 calc(12px + var(--safe-b));flex-shrink:0}
.screen.lesson{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(20px + var(--safe-b))}
.btn.next{font-size:24px;padding:16px 28px;min-height:66px}
.btn.next.prominent{font-size:30px;padding:20px 40px;min-height:78px;border-radius:20px}
.btn.next.pulse-next{animation:nextGlow 1.5s ease-in-out infinite}
@keyframes nextGlow{
  0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.25),0 0 0 0 rgba(255,184,77,.65);filter:brightness(1)}
  50%{box-shadow:0 4px 0 rgba(0,0,0,.25),0 0 18px 6px rgba(255,184,77,.45);filter:brightness(1.08)}
}
.next-wrap{display:flex;align-items:center;justify-content:center;gap:12px}
.next-cue{font-size:40px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.hero-card.tappable{cursor:pointer}
.coach-tip{background:rgba(255,184,77,.16);border:2px solid var(--accent);border-radius:16px;padding:10px 16px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto;text-align:left}
.coach-tip .coach-x{margin-left:auto;background:var(--panel2);border-radius:999px;width:36px;height:36px;font-size:18px;font-weight:800;flex:none}
.how-card{background:var(--panel);border-radius:24px;padding:28px 26px;max-width:640px;width:100%;margin:12px auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.how-card h1{font-size:28px;margin:0}
.how-card .how-lines{display:flex;flex-direction:column;gap:10px}
.how-card .how-line{font-size:20px;font-weight:600;line-height:1.4;background:var(--panel2);border-radius:14px;padding:12px 16px}
.how-card .how-goal{font-size:18px;color:var(--muted);font-weight:600;line-height:1.4}
.how-card .how-goal b{color:var(--accent);font-weight:800}
.how-card.compact{padding:18px 20px;gap:12px}
.how-card.compact .how-line{font-size:17px;padding:8px 12px}
.how-toggle{display:flex;align-items:center;gap:10px;font-size:17px;color:var(--muted);font-weight:600;justify-content:center;cursor:pointer}
.how-toggle input{width:22px;height:22px;accent-color:var(--accent)}
.ui-en{font-weight:700;opacity:.85}
@media (prefers-reduced-motion:reduce){
  .btn.next.pulse-next,.lesson-dot.current,.btn.mic.on,.next-cue{animation:none!important}
}
.toast{position:fixed;left:50%;bottom:calc(30px + var(--safe-b));transform:translateX(-50%);background:var(--accent);color:#2a1d05;font-weight:800;font-size:22px;padding:14px 24px;border-radius:999px;z-index:60;text-align:center}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--panel);border-radius:24px;padding:28px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.modal input{font-size:26px;padding:14px;border-radius:14px;border:0;width:100%;text-align:center;-webkit-user-select:text;user-select:text}
.en{font-size:16px;color:var(--blue);font-style:italic;margin-top:4px;font-weight:500}
.idea{background:var(--panel);border-radius:20px;padding:24px;font-size:20px;line-height:1.5}
a{color:var(--blue)}

/* ---------- hub / path ---------- */
.today .big{font-size:24px;margin-bottom:8px}
.path{display:flex;flex-direction:column;gap:12px}
.unit{background:var(--panel);border-radius:20px;overflow:hidden;border:3px solid transparent}
.unit.open{border-color:var(--accent)}
.unit.locked{opacity:.55}
.unit.soon{opacity:.45}
.unit.done .uicon{background:var(--good)}
.unit-head{display:flex;gap:14px;align-items:center;padding:14px 16px;width:100%;min-height:76px}
.uicon{font-size:34px;width:58px;height:58px;border-radius:16px;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex:none}
.utitle{font-size:22px;font-weight:800}
.chev{font-size:26px;color:var(--muted)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:0 14px 14px}
.lesson-dot{background:var(--panel2);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;text-align:left;min-height:70px;align-items:center}
.lesson-dot .ld-icon{font-size:30px;grid-row:span 2}
.lesson-dot .ld-title{font-size:18px;font-weight:700}
.lesson-dot .ld-stars{color:var(--accent);font-size:18px;letter-spacing:2px}
.lesson-dot .en{grid-column:1/3;font-size:14px}
.lesson-dot.done{background:#2f5a4f}
.lesson-dot.current{outline:4px solid var(--accent);animation:pulse 1.6s infinite}
.lesson-dot.locked{opacity:.5}
@keyframes pulse{0%,100%{outline-color:var(--accent)}50%{outline-color:rgba(255,184,77,.35)}}

/* ---------- lesson ---------- */
.lesson{gap:10px}
.lesson-progress{display:flex;align-items:center;gap:12px}
.lesson-progress .progress{flex:1}
.set-label{font-weight:800;font-size:18px;white-space:nowrap}
.instr{font-size:24px;font-weight:800;text-align:center}
.instr .ii{font-size:28px}
.tag{font-size:15px;background:var(--panel2);border-radius:999px;padding:4px 10px;vertical-align:middle;font-weight:700}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;justify-content:flex-start;width:100%}
.es{font-size:26px;font-weight:800;text-align:center;line-height:1.3}
.big-es{font-size:clamp(28px,4.6vw,44px)}
.hero-card{background:var(--tile);color:var(--tileInk);border-radius:28px;padding:18px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:min(560px,92%);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.hero-card .en{color:#3d6f91}
.hero-card.slim{padding:12px 22px;min-width:min(420px,80%)}
.hero-card.row-hero{flex-direction:row;justify-content:center;gap:24px}
.audio-row{display:flex;gap:12px;justify-content:center}
.btn.audio{background:var(--blue);color:#0d2233;font-size:30px;min-width:76px;min-height:68px;border-radius:999px;padding:8px 20px}
.btn.audio.big{font-size:40px;min-width:110px;min-height:84px}
.btn.audio.slow{background:#a8e6cf;font-size:28px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%;max-width:760px}
.tiles.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile-pic{background:var(--tile);color:var(--tileInk);border-radius:24px;min-height:200px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.25);padding:10px;transition:background .2s,opacity .2s,transform .1s;border:5px solid transparent}
.tile-pic.good,.opt.good{background:#c9f5d9;border-color:var(--good);animation:pop .35s}
.tile-pic.soft,.opt.soft{background:var(--soft);opacity:.55;animation:wiggle .4s}
@keyframes wiggle{0%,100%{translate:0}25%{translate:-7px}75%{translate:7px}}
@keyframes pop{50%{transform:scale(1.05)}}
.opts{display:flex;flex-direction:column;gap:12px;width:100%;max-width:640px}
.opts.row-opts{flex-direction:row;flex-wrap:wrap;justify-content:center}
.opts.row-opts .opt{flex:1;min-width:150px}
.opt{background:var(--tile);color:var(--tileInk);border-radius:18px;font-size:26px;font-weight:800;min-height:72px;padding:12px 18px;box-shadow:0 5px 0 rgba(0,0,0,.25);border:4px solid transparent}
.fb{min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center}
.fb>div{border-radius:16px;padding:10px 18px;font-size:22px;font-weight:700}
.fb-good{background:rgba(95,211,141,.18);color:#c9f5d9}
.fb-soft{background:rgba(205,180,219,.18);color:#eadcf2}
.fb-info{background:rgba(126,200,227,.15);color:#d6f0fa}
.heard{font-style:italic;font-weight:600;color:var(--accent)}
.btn.mic{background:var(--pink);color:#3a0d1b;font-size:26px;padding:16px 30px}
.btn.mic.on{animation:pulse2 1s infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 14px rgba(255,143,171,.25)}}
/* spelling */
.spell-line{display:flex;gap:6px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.prefix{font-size:34px;font-weight:800;margin-right:8px;color:var(--muted)}
.slot{width:48px;height:62px;border-bottom:5px solid var(--muted);font-size:38px;font-weight:900;display:flex;align-items:center;justify-content:center}
.slot.filled{border-color:var(--accent)}
.slot.warn{border-color:var(--orange);color:var(--orange)}
.keys{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:820px}
.key{background:var(--tile);color:var(--tileInk);border-radius:14px;font-size:32px;font-weight:800;min-width:66px;min-height:66px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.key:disabled{opacity:.25}
.key.acc{background:#ffe3b3;min-width:60px}
.key.del{background:var(--panel2);color:var(--ink)}
/* sentence builder */
.build-line{min-height:82px;width:100%;max-width:860px;border-bottom:4px dashed var(--panel2);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:8px}
.wtiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:860px}
.wtile{background:var(--tile);color:var(--tileInk);border-radius:14px;font-size:28px;font-weight:800;min-height:62px;min-width:62px;padding:8px 18px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.wtile:disabled{opacity:.2}
.wtile.placed{background:#ffe3b3}
.blank{display:inline-block;min-width:110px;border-bottom:5px solid var(--accent);color:var(--accent);margin:0 6px}
.blank.good{color:var(--good);border-color:var(--good)}
.fill-line{color:var(--ink)}
/* pattern */
.pattern-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;width:100%}
.pgroup{background:var(--panel);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px;border-top:8px solid var(--blue)}
.pgroup.c1{border-top-color:var(--pink)}.pgroup.c2{border-top-color:var(--good)}.pgroup.c3{border-top-color:var(--accent)}
.pex{background:var(--tile);color:var(--tileInk);border-radius:16px;padding:8px 10px;display:flex;align-items:center;gap:10px;min-height:84px}
.pex .es{font-size:22px;text-align:left;color:var(--tileInk)}
.hl{color:#c2410c;background:#ffe3b3;border-radius:5px;padding:0 1px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.c0 .hl{color:#1d4ed8;background:#dbeafe}.c1 .hl{color:#be185d;background:#fce7f3}.c2 .hl{color:#15803d;background:#dcfce7}
.pattern-card{background:var(--tile);color:var(--tileInk);border-radius:28px;padding:30px;max-width:720px;width:100%;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.25);border:5px dashed var(--accent)}
.pc-badge{font-size:22px;font-weight:800;color:#b45309}
.pc-text{font-size:clamp(28px,4.4vw,40px);font-weight:900;margin-top:10px;line-height:1.35}
.pattern-card .en{color:#3d6f91;font-size:18px}
/* dialogue */
.scene{font-size:54px}
.chat{display:flex;flex-direction:column;gap:12px;width:100%;max-width:820px}
.bubble-row{display:flex;gap:12px;align-items:flex-end;text-align:left;width:100%}
.bubble-row.right{flex-direction:row-reverse;text-align:right}
.who{display:flex;flex-direction:column;align-items:center;font-size:44px;min-width:76px;line-height:1}
.who small{font-size:14px;color:var(--muted);margin-top:4px}
.bubble{background:var(--tile);color:var(--tileInk);border-radius:20px;padding:12px 18px;font-size:23px;font-weight:700;max-width:78%}
.bubble .en{color:#3d6f91}
.bubble-row.right .bubble{background:#ffe3b3}
.bubble-row.speaking .bubble{outline:4px solid var(--blue)}
/* end of lesson */
.celebrate-emoji{font-size:96px;animation:pop 1s}
.stars{font-size:72px;letter-spacing:10px;color:var(--panel2)}
.stars span{display:inline-block}
.stars span.on{color:var(--accent);animation:starIn .6s both}
@keyframes starIn{0%{transform:scale(0) rotate(-90deg)}80%{transform:scale(1.25)}100%{transform:scale(1)}}
.unlock{font-size:22px;font-weight:800;color:var(--accent)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.confetti span{position:absolute;top:-60px;animation:fall 3.2s ease-in forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg);opacity:.7}}
.setlist{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.setpill{background:var(--panel2);border-radius:999px;padding:8px 14px;font-size:18px;font-weight:700;opacity:.6}
.setpill.done{background:#2f5a4f;opacity:1}.setpill.now{outline:3px solid var(--accent);opacity:1}
/* parent */
.pcard{gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;font-size:18px}
.stats>div{background:var(--panel2);border-radius:14px;padding:10px 12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding:8px 0}
.bar-wrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch}
.bar-wrap div{background:var(--blue);border-radius:6px 6px 0 0;min-height:3px}
.bar-wrap div.goal{background:var(--good)}
.bar-num{font-size:12px;text-align:center;color:var(--muted)}
.bars-labels{display:flex;gap:6px;font-size:12px;color:var(--muted)}.bars-labels span{flex:1;text-align:center}
.trouble{display:flex;flex-wrap:wrap;gap:8px}
.trouble span{background:var(--panel2);border-radius:12px;padding:6px 12px;font-size:18px;font-weight:700}
.trouble i{color:var(--blue);font-weight:500}
.trouble small{color:var(--muted)}

/* ---------- pictures (sizes cascade in em from .pic) ---------- */
.pic{font-size:120px;line-height:1;display:flex;align-items:center;justify-content:center;gap:.08em;max-width:100%}
.pic.hero{font-size:150px}
.pic.hero.sm{font-size:110px}
.pic.tile{font-size:96px}
.pic.tile.sm{font-size:64px}
.pic.multi>*{font-size:.62em}
.emo{display:inline-block;font-family:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif;white-space:nowrap}
.emo.g1{font-size:1em}.emo.g2{font-size:.72em}.emo.g3{font-size:.54em}.emo.g4{font-size:.42em}
svg.shape{width:1.25em;height:1.25em;display:block}
.rep{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;max-width:3.2em;gap:.04em}
.rep .ri{font-size:.5em}
.rep.n1 .ri{font-size:.9em}.rep.n2{max-width:2.6em}.rep.n2 .ri{font-size:.6em}
.rep.many{max-width:3.4em}.rep.many .ri{font-size:.34em}
.rep .ri svg.shape{width:1.25em;height:1.25em}
.size{display:inline-flex;align-items:flex-end;gap:.12em}
.size .sz-s{font-size:.42em}
.size .off{opacity:.28;filter:grayscale(.7)}
.size .on{filter:drop-shadow(0 0 .06em #ffb84d)}
.lens{display:inline-flex;flex-direction:column;align-items:flex-start;gap:0}
.lens svg.shape{width:1.5em;height:.75em}
.lens .off{opacity:.3}
.numb{font-size:.8em;font-weight:900;color:#2f6fde;background:#e5efff;border-radius:.2em;padding:.05em .25em;min-width:1em;text-align:center;font-family:-apple-system,Roboto,sans-serif}
.week{display:inline-flex;gap:.05em}
.week span{font-size:.24em;font-weight:900;width:1.5em;height:1.7em;border-radius:.3em;background:#e8e2d4;color:#8b8172;display:flex;align-items:center;justify-content:center;font-family:-apple-system,Roboto,sans-serif}
.week span.on{background:#ffb84d;color:#2a1d05;transform:scale(1.25)}
.fam{display:inline-flex;flex-direction:column;align-items:center;gap:.04em}
.fam .fr{display:flex;gap:.04em;align-items:flex-end}
.fam .fm{font-size:.22em;opacity:.3;font-family:"Apple Color Emoji","Noto Color Emoji",sans-serif;position:relative}
.fam .fm.on{opacity:1;font-size:.34em;filter:drop-shadow(0 0 .08em #ffb84d)}
.fam .fm.me::after{content:"⭐";position:absolute;top:-.35em;right:-.2em;font-size:.45em}
.pos{position:relative;display:inline-flex;align-items:flex-end;justify-content:center}
.pos .pb{position:relative;z-index:1}
.pos .pa{position:absolute;font-size:.5em;z-index:2;left:50%;transform:translateX(-50%)}

<body>
<div id="app"></div>
<script>
/* Paso a Paso — core engine: content loading, lesson generation, spaced review, answer checking.
   Pure JavaScript with no DOM access, so it runs both in the browser and in Node (for tests). */
(function () {
'use strict';
const ROOT = typeof globalThis !== 'undefined' ? globalThis : this;

/* ---------- seeded random ---------- */
function rng(seed) {
  let a = (seed >>> 0) || 1;
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function shuffle(a, r) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function uniqBy(a, f) { const s = new Set(); return a.filter(x => { const k = f(x); if (s.has(k)) return false; s.add(k); return true; }); }

/* ---------- text helpers ---------- */
function stripAccents(s) { return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function norm(s) { return stripAccents(String(s).toLowerCase()).replace(/[¿¡?!.,;:"“”'’«»()…\-–—]/g, ' ').replace(/\s+/g, ' ').trim(); }
const NUMS = ['cero', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte'];
const VEINTI = ['veinte', 'veintiuno', 'veintidós', 'veintitrés', 'veinticuatro', 'veinticinco', 'veintiséis', 'veintisiete', 'veintiocho', 'veintinueve'];
const TENS = { 3: 'treinta', 4: 'cuarenta', 5: 'cincuenta', 6: 'sesenta', 7: 'setenta', 8: 'ochenta', 9: 'noventa' };
function numWord(n) {
  if (n <= 20) return NUMS[n];
  if (n < 30) return VEINTI[n - 20];
  if (n === 100) return 'cien';
  const t = Math.floor(n / 10), u = n % 10;
  return TENS[t] + (u ? ' y ' + NUMS[u] : '');
}
function digitsToWords(s) { return String(s).replace(/\d+/g, d => (+d <= 100 ? numWord(+d) : d)); }
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = new Array(n + 1), cur = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) { cur[0] = i; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); const t = prev; prev = cur; cur = t; }

function speechMatch(heardList, target) {
  let best = 0, heard = '';
  const nt = norm(digitsToWords(target)), tw = nt.split(' ');
  (heardList || []).forEach(h => {
    const nh = norm(digitsToWords(h));
    let sc = similarity(nh, nt);
    if (nt && (' ' + nh + ' ').indexOf(' ' + nt + ' ') >= 0) sc = Math.max(sc, 0.95);
    const hw = new Set(nh.split(' '));
    const overlap = tw.filter(w => hw.has(w)).length / tw.length;
    sc = Math.max(sc, overlap * 0.9);
    if (sc > best) { best = sc; heard = h; }

  return { pass: best >= need, score: Math.round(best * 100) / 100, heard };

/* ---------- content model ---------- */
const ARTICLES = ['el', 'la', 'los', 'las', 'un', 'una', 'unos', 'unas'];
const ACCENT_KEYS = ['á', 'é', 'í', 'ó', 'ú', 'ñ', '¿', '?', '¡', '!'];
const CAST = {
  S: { name: 'Sofía', pic: '👧🏽', pitch: 1.25 },
  M: { name: 'Mateo', pic: '👦🏻', pitch: 0.9 },
  V: { name: 'Valentina', pic: '👧🏼', pitch: 1.15 },
  L: { name: 'Lucas', pic: '👦🏾', pitch: 0.8 },
  P: { name: 'la maestra', pic: '👩🏽‍🏫', pitch: 1.05 },
  A: { name: 'la abuela', pic: '👵🏽', pitch: 1.0 },
  D: { name: 'papá', pic: '👨🏻', pitch: 0.75 },
  E: { name: 'mamá', pic: '👩🏻', pitch: 1.1 },
  W: { name: 'el mesero', pic: '🤵🏽', pitch: 0.85 },
  N: { name: 'la enfermera', pic: '👩🏻‍⚕️', pitch: 1.05 },
  T: { name: 'la vendedora', pic: '👩🏾‍💼', pitch: 1.1 },
  C: { name: 'el entrenador', pic: '🧔🏽', pitch: 0.8 }
};
function picCat(pic) {
  if (/^svg:blob/.test(pic)) return 'color';
  if (/^(size:|len:)/.test(pic)) return 'size';
  if (/^fam:/.test(pic)) return 'fam';
  if (/^pos:/.test(pic)) return 'pos';
  if (/^clock:/.test(pic)) return 'clock';
  if (/^week:/.test(pic)) return 'week';
  if (/^(num:|\d+\*)/.test(pic)) return 'count';
  if (/svg:/.test(pic)) return 'thing';
  return 'emoji';
}
function parseItem(s, extra) {
  let it;
  if (typeof s === 'string') { const p = s.split('|').map(x => x.trim()); it = { es: p[0], pic: p[1] || '', en: p[2] || '', alt: p[3] ? p[3].split('||').map(x => x.trim()) : [] }; }
  else it = Object.assign({ alt: [] }, s);
  const words = it.es.replace(/[¿¡?!.,]/g, ' ').trim().split(/\s+/);
  const core = words.length === 2 && ARTICLES.indexOf(words[0].toLowerCase()) >= 0 ? words.slice(1) : words;
  it.kind = core.length === 1 ? 'word' : /[.?!]$/.test(it.es) ? 'sentence' : 'phrase';
  it.say = it.say || it.es;
  it.cat = picCat(it.pic);
  return Object.assign(it, extra || {});
}
function parseFill(s, extra) {
  const p = s.split('|').map(x => x.trim());
  const m = p[0].match(/^(.*)\[(.+?)\](.*)$/);
  if (!m) throw new Error('fill needs [answer]: ' + s);
  const answer = m[2], wrong = (p[3] || '').split(',').map(x => x.trim()).filter(Boolean);
  return Object.assign({ es: m[1] + answer + m[3], before: m[1], after: m[3], answer, wrong, pic: p[1] || '', en: p[2] || '', say: m[1] + answer + m[3] }, extra || {});
}
function parseHL(s) { // "[el] gato|🐱" -> {es:'el gato', html parts, pic}
  const p = s.split('|').map(x => x.trim());
  return { es: p[0].replace(/[\[\]]/g, ''), marked: p[0], pic: p[1] || '', en: p[2] || '' };
}
function parseLine(s) { const p = s.split('|').map(x => x.trim()); return { who: p[0], es: p[1], en: p[2] || '', say: p[1] }; }
function parseReply(s, defWho) {
  const p = s.split('|').map(x => x.trim());
  let prompt = p[0], who = defWho;
  const m = prompt.match(/^([A-Z])>\s*(.*)$/); if (m) { who = m[1]; prompt = m[2]; }
  return { who, prompt, answer: p[1], wrong: (p[2] || '').split(';').map(x => x.trim()).filter(Boolean), en: p[3] || '', pic: p[4] || '', say: prompt };
}

const SL = {
  units: [], unitByN: {}, lessons: [], lessonById: {}, itemsByEs: {}, outline: [],
  rng, shuffle, sample, norm, stripAccents, similarity, speechMatch, numWord, digitsToWords, lev,
  ARTICLES, ACCENT_KEYS, CAST, parseItem, parseFill
};

function loadContent(rawUnits, outline) {
  SL.units = []; SL.unitByN = {}; SL.lessons = []; SL.lessonById = {}; SL.itemsByEs = {}; SL.outline = outline || [];
  const byN = {}; (rawUnits || []).forEach(u => { byN[u.n] = u; });
  const total = Math.max(SL.outline.length, ...Object.keys(byN).map(Number), 0);
  for (let n = 1; n <= total; n++) {
    const o = SL.outline[n - 1] || { n, title: 'Unidad ' + n, icon: '⭐', lessons: [] };
    const raw = byN[n];
    const unit = { n, id: 'u' + n, title: (raw && raw.title) || o.title, icon: (raw && raw.icon) || o.icon, theme: (raw && raw.theme) || o.theme || '',
      grammar: (raw && raw.grammar) || o.grammar || '', built: !!raw, lessons: [] };
    const srcLessons = raw ? raw.lessons : o.lessons;
    srcLessons.forEach((rl, i) => {
      const ol = (o.lessons || [])[i] || {};
      const L = { id: 'u' + n + 'l' + (i + 1), unit: n, idx: i, title: rl.title || ol.title, icon: rl.icon || ol.icon || unit.icon,
        goal: rl.goal || ol.goal || '', built: !!raw, vocab: ol.vocab || rl.vocab || '' };
      if (raw) {
        L.items = (rl.items || []).map(s => parseItem(s, { lid: L.id, unit: n }));
        L.fills = (rl.fills || []).map(s => parseFill(s, { lid: L.id, unit: n }));
        L.review = rl.review || [];
        if (rl.pattern) {
          const pt = rl.pattern;
          L.pattern = { title: pt.title || '', groups: pt.groups.map(g => g.map(parseHL)), quiz: (pt.quiz || []).map(s => parseFill(s, { lid: L.id, unit: n })), card: pt.card, en: pt.en || '' };
        }
        if (rl.dialogue) {
          const d = rl.dialogue, lines = d.lines.map(parseLine);
          L.dialogue = { scene: d.scene || '', lines, replies: (d.replies || []).map(s => parseReply(s, lines[0].who)) };
        }
        L.items.forEach(it => { if (!SL.itemsByEs[it.es]) SL.itemsByEs[it.es] = it; });
        SL.lessons.push(L); SL.lessonById[L.id] = L;
      }
      unit.lessons.push(L);
    });
    SL.units.push(unit); SL.unitByN[n] = unit;
  }
  SL.lessons.forEach((L, i) => { L.flat = i; });
  return SL;
}

/* all items of a unit (deduped by Spanish text), optionally only up to a lesson index */
function unitPool(n, uptoIdx) {
  const u = SL.unitByN[n]; if (!u || !u.built) return [];
  let items = [];
  u.lessons.forEach((L, i) => { if (uptoIdx === undefined || i <= uptoIdx) items = items.concat(L.items); });
  if (uptoIdx !== undefined && uniqBy(items, x => x.es).length < 6) u.lessons.forEach((L, i) => { if (i > uptoIdx) items = items.concat(L.items); });
  return uniqBy(items, x => x.es);
}

/* choose distractors: never the same text or the same picture; prefer same picture type and same kind */
function pickDistractors(target, pool, n, r, preferLid) {
  const cand = pool.filter(it => it.es !== target.es && norm(it.es) !== norm(target.es) && it.pic !== target.pic);
  const tiers = [
    it => it.cat === target.cat && it.kind === target.kind && it.lid === preferLid,
    it => it.cat === target.cat && it.kind === target.kind,
    it => it.cat === target.cat,
    it => it.kind === target.kind,
    () => true
  ];
  const out = [], pics = new Set([target.pic]), texts = new Set([norm(target.es)]);
  for (const t of tiers) {
    for (const it of shuffle(cand.filter(t), r)) {
      if (out.length >= n) break;
      if (pics.has(it.pic) || texts.has(norm(it.es))) continue;
      out.push(it); pics.add(it.pic); texts.add(norm(it.es));
    }
    if (out.length >= n) break;
  }
  return out;
}
function exChoice(type, item, pool, r, preferLid, n) {
  n = n || 4;
  const ds = pickDistractors(item, pool, n - 1, r, preferLid);
  if (ds.length < 1) return null;
  const choices = shuffle([item].concat(ds), r);
  return { type, item, say: item.say, choices, answer: choices.indexOf(item), graded: true };
}

/* ---------- spelling ---------- */
function spellTarget(item) {
  const parts = item.es.trim().split(/\s+/);
  let prefix = '', target;
  if (parts.length === 2 && ARTICLES.indexOf(parts[0].toLowerCase()) >= 0) { prefix = parts[0] + ' '; target = parts[1]; }
  else if (parts.length === 1) target = parts[0];
  else return null;
  if (/[A-ZÁÉÍÓÚÑ]/.test(target.replace(/^[¡¿]/, '').charAt(0)) && item.kind === 'word' && !/^[¡¿]/.test(target) && parts.length === 1 && item.properNoun) return null;
  target = target.toLowerCase();
  if (target.length > 11 || !/^[a-záéíóúñü¿?¡!]+$/.test(target)) return null;
  return { prefix: prefix.toLowerCase(), target };
}
const FILLER = 'aeiourlnstcdmp';
function exSpell(item, r) {
  const st = spellTarget(item); if (!st) return null;
  const letters = st.target.split('').filter(c => ACCENT_KEYS.indexOf(c) < 0);
  const extra = []; let guard = 0;
  while (extra.length < 2 && guard++ < 50) { const c = FILLER[Math.floor(r() * FILLER.length)]; if (letters.indexOf(c) < 0 && extra.indexOf(c) < 0) extra.push(c); }
  let tiles = shuffle(letters.concat(extra), r);
  if (tiles.join('') === letters.join('') + extra.join('')) tiles = tiles.reverse();
  return { type: 'spell', item, say: item.say, prefix: st.prefix, target: st.target, tiles, graded: true };
}

/* ---------- sentence builder ---------- */
function tokenize(s) {
  let t = String(s).trim().replace(/\.$/, '');
  t = t.replace(/([¿¡])/g, '$1 ').replace(/([?!])/g, ' $1 ');
  return t.split(/\s+/).filter(Boolean);
}
function joinTokens(tokens) { return tokens.join(' ').replace(/([¿¡]) /g, '$1').replace(/ ([?!])/g, '$1'); }
const ADJ = ['rojo', 'negro', 'blanco', 'amarillo', 'anaranjado', 'morado', 'rosado', 'pequeño', 'alto', 'bajo', 'largo', 'corto', 'nuevo', 'viejo', 'bonito', 'feo', 'lento', 'rápido', 'limpio', 'sucio', 'simpático', 'divertido', 'cansado', 'contento', 'enojado', 'nervioso', 'aburrido', 'enfermo', 'delicioso', 'rico', 'emocionado', 'mojado', 'lleno', 'ocupado', 'preocupado', 'listo', 'nublado', 'favorito', 'mucho', 'cómodo', 'caro', 'barato', 'tranquilo', 'perezoso', 'gordo', 'flaco', 'hermoso', 'blanco', 'nuestro', 'primero', 'segundo', 'tercero', 'último'];
const INVAR = ['verde', 'azul', 'gris', 'café', 'grande', 'feliz', 'inteligente', 'amable', 'fuerte', 'triste', 'interesante', 'difícil', 'fácil', 'joven', 'alegre'];
function adjVariants(w) {
  const lw = w.toLowerCase(), out = [];
  for (const a of ADJ) {
    const stem = a.slice(0, -1), forms = [a, stem + 'a', a + 's', stem + 'as'];
    const i = forms.indexOf(lw); if (i >= 0) { out.push(forms[[1, 0, 3, 2][i]]); out.push(forms[[2, 3, 0, 1][i]]); }
  }
  for (const a of INVAR) {
    const pl = /[aeiouáéíóú]$/.test(a) ? a + 's' : (a === 'feliz' ? 'felices' : a === 'joven' ? 'jóvenes' : a + 'es');
    if (lw === a) out.push(pl); else if (lw === pl) out.push(a);

}
const SWAP = { el: 'la', la: 'el', los: 'las', las: 'los', un: 'una', una: 'un', es: 'son', son: 'es', está: 'están', están: 'está', mi: 'mis', mis: 'mi', gusta: 'gustan', gustan: 'gusta', duele: 'duelen', duelen: 'duele', cuesta: 'cuestan', cuestan: 'cuesta', hace: 'es', al: 'a la', del: 'de la', este: 'esta', esta: 'este' };
function exBuild(item, r, pool) {
  const tokens = tokenize(item.es);
  const words = tokens.filter(t => !/^[¿¡?!]$/.test(t));
  if (words.length < 2 || words.length > 8) return null;
  const lowerSet = new Set(tokens.map(t => t.toLowerCase().replace(/,$/, '')));
  let cands = [];
  tokens.forEach((t, i) => {
    const bare = t.replace(/,$/, ''), lw = bare.toLowerCase();
    const vs = [];

    adjVariants(bare).forEach(v => vs.push(v));
    vs.forEach(v => { if (!lowerSet.has(v)) cands.push(i === 0 ? v.charAt(0).toUpperCase() + v.slice(1) : v); });
  });
  cands = uniqBy(shuffle(cands, r), x => x.toLowerCase()).slice(0, 2);

    const w = shuffle(pool.filter(p => p.kind === 'word'), r).map(p => p.es.split(' ').pop().replace(/[¡!¿?]/g, '').toLowerCase()).find(x => !lowerSet.has(x));

}
function checkBuild(ex, placedTokens) { return ex.answers.indexOf(joinTokens(placedTokens)) >= 0; }

function exFill(f, r) {
  const opts = shuffle(uniqBy([f.answer].concat(f.wrong), x => x), r);
  return { type: 'fill', item: f, say: f.say, options: opts, answer: opts.indexOf(f.answer), graded: true };
}

/* ---------- lesson generation ---------- */
function chunk(a, n) { const out = []; for (let i = 0; i < a.length; i += n) out.push(a.slice(i, i + n)); return out; }
function buildLesson(L, r) {
  r = r || rng(Date.now());
  const pool = unitPool(L.unit, L.idx), items = L.items, sets = [];
  // 1) look & listen: meet 3 new things, then find them by ear
  const A = [];
  chunk(items, 3).forEach(ch => {
    ch.forEach(it => A.push({ type: 'intro', item: it, say: it.say }));
    shuffle(ch, r).forEach(it => { const e = exChoice('listen', it, pool, r, L.id); if (e) A.push(e); });
  });
  sets.push({ key: 'listen', name: 'Mira y escucha', icon: '🎧', ex: A });
  // 2) read: read it, tap the picture; see a picture, pick the words; plus review from earlier lessons
  const B = [];
  sample(items, Math.min(6, items.length), r).forEach(it => { const e = exChoice('read', it, pool, r, L.id); if (e) B.push(e); });
  const longer = items.filter(it => it.kind !== 'word');
  sample(longer.length >= 2 ? longer : items, 3, r).forEach(it => { const e = exChoice('pick', it, pool, r, L.id, 3); if (e) B.push(e); });
  const earlier = unitPool(L.unit, L.idx - 1).filter(it => it.lid !== L.id && !items.some(x => x.es === it.es));
  const rev = L.review.map(es => SL.itemsByEs[es]).filter(Boolean).concat(sample(earlier, 2, r));
  uniqBy(rev, x => x.es).slice(0, 3).forEach((it, i) => { const e = exChoice(i % 2 ? 'read' : 'listen', it, unitPool(it.unit), r, it.lid); if (e) { e.review = true; B.push(e); } });
  sets.push({ key: 'read', name: 'Lee', icon: '📖', ex: shuffle(B, r) });
  // 3) speak & write
  const C = [];
  const sp = longer.length >= 3 ? sample(longer, 3, r) : sample(items, 3, r);
  sp.forEach(it => C.push({ type: 'speak', item: it, say: it.say }));
  const spellable = items.filter(it => spellTarget(it));
  const accented = spellable.filter(it => /[áéíóúñ¿¡]/.test(it.es));
  uniqBy(sample(accented, 2, r).concat(sample(spellable, 3, r)), x => x.es).slice(0, 3).forEach(it => { const e = exSpell(it, r); if (e) C.push(e); });
  const buildable = items.filter(it => it.kind !== 'word');
  sample(buildable, 3, r).forEach(it => { const e = exBuild(it, r, pool); if (e) C.push(e); });
  if (!L.pattern) L.fills.forEach(f => C.push(exFill(f, r)));
  sets.push({ key: 'speak', name: 'Habla y escribe', icon: '🗣️', ex: C });
  // 4) discover a pattern
  if (L.pattern) {
    const D = [{ type: 'patternShow', pattern: L.pattern, say: L.pattern.groups.map(g => g.map(x => x.es).join(', ')).join('. ') }];
    L.pattern.quiz.forEach(q => { const e = exFill(q, r); e.patternQuiz = true; D.push(e); });

/* Paso a Paso — audio. Text-to-speech with the device's own Spanish voice (Web Speech API),

(function () {
'use strict';
const W = window;
const synth = W.speechSynthesis || null;

  if (!synth) return;

  const lang = v => v.lang.replace('_', '-').toLowerCase();

  for (const p of PREF) { const cands = es.filter(v => lang(v) === p); if (cands.length) { voice = cands.find(v => v.localService) || cands[0]; break; } }
  if (!voice) voice = es.find(v => lang(v) !== 'es-es') || es[0] || null;
}
if (synth) {
  pickVoice();
  if (synth.addEventListener) synth.addEventListener('voiceschanged', pickVoice); else synth.onvoiceschanged = pickVoice;
  setTimeout(pickVoice, 400); setTimeout(pickVoice, 1500);
}

function unlock() {

}
['touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, unlock, { capture: true, passive: true }));

let queueToken = 0;
function say(text, opts) {
  opts = opts || {};

    return true;
  } catch (e) { return false; }
}
/* play several lines one after another (dialogues) */
function sayLines(lines, onLine, onDone) {
  const my = ++queueToken; let i = 0;
  const next = () => {
    if (my !== queueToken) return;
    if (i >= lines.length) { if (onDone) onDone(); return; }
    const l = lines[i]; if (onLine) onLine(i);
    const cur = i++;

<script>

(function () {

}

      s.settings = Object.assign(defSettings(), s.settings || {});
      s.players.forEach(p => {
        if (p.uiEn == null) p.uiEn = 'auto';
        if (p.howWorks == null) p.howWorks = 'auto';

}

function howLinesFor(built) {
  return built.sets.map(s => {
    const types = new Set(s.ex.map(e => e.type));
    if (s.key === 'listen') {
      if (types.has('intro') && types.has('listen')) return '👀 Look and listen to new words, then tap the matching picture. Tap 🔊 / 🐢 to hear again.';
      if (types.has('intro')) return '👀 Look and listen to new words. Tap 🔊 to hear again, 🐢 for slow.';
      return '🎧 Listen and tap the right picture.';
    }
    if (s.key === 'read') {
      if (types.has('pick') && !types.has('read')) return '👀 Look at the picture and pick the right words.';
      if (types.has('pick')) return '📖 Read or look, then pick the matching picture or words.';
      return '📖 Read and tap the matching picture.';
    }
    if (s.key === 'speak') {
      const bits = [];
      if (types.has('speak')) bits.push('say it out loud');
      if (types.has('spell')) bits.push('spell a word');
      if (types.has('build')) bits.push('build a sentence from word tiles');
      if (!bits.length) return '🗣️ Practice speaking and writing.';
      return '🗣️ ' + bits[0].charAt(0).toUpperCase() + bits[0].slice(1) + (bits.length > 1 ? ', and ' + bits.slice(1).join(', ') : '') + '.';
    }

        '<div class="build-line">' + (E.done ? '<span class="es">' + esc(it.es) + '</span>' : E.placed.map((ti, k) => '<button class="wtile placed" data-act="unplace" data-arg="' + k + '">' + esc(ex.tiles[ti]) + '</button>').join('') + (E.placed.length ? '' : '<span class="muted">…</span>')) + '</div>' +
        (E.done ? '' : '<div class="wtiles">' + ex.tiles.map((t, i) => '<button class="wtile" data-act="place" data-arg="' + i + '"' + (E.placed.indexOf(i) >= 0 ? ' disabled' : '') + '>' + esc(t) + '</button>').join('') + '</div>');
      actions = E.done ? next : '<button class="btn" data-act="checkBuild"' + (E.placed.length ? '' : ' disabled') + '>' + uiBtn('Comprobar ✓', 'Check') + '</button>';
      break; }
    case 'fill': {
      const f = ex.item;
      const blank = E.done ? '<b class="blank good">' + esc(f.answer) + '</b>' : '<b class="blank">　?　</b>';
      body = (f.pic ? '<div class="hero-card slim">' + R_(f.pic, 'hero') + '</div>' : '') + '<div class="es big-es fill-line">' + esc(f.before) + blank + esc(f.after) + '</div>' + en(f.en) + (E.done ? audioBtns() : '') +
        '<div class="opts row-opts">' + ex.options.map((o, i) => '<button class="opt' + (E.used.indexOf(i) >= 0 ? ' soft' : '') + (E.done && i === ex.answer ? ' good' : '') + '" data-act="chooseOpt" data-arg="' + i + '"' + (E.done || E.used.indexOf(i) >= 0 ? ' disabled' : '') + '>' + esc(o) + '</button>').join('') + '</div>';
      actions = E.done ? next : ''; break; }
    case 'patternShow': {
      const cols = ['c0', 'c1', 'c2', 'c3'];
      body = '<div class="pattern-groups">' + ex.pattern.groups.map((g, gi) => '<div class="pgroup ' + cols[gi % 4] + '">' + g.map(x => '<button class="pex" data-act="sayText" data-arg="' + esc(x.es) + '">' + R_(x.pic, 'tile sm') + '<span class="es">' + hl(x.marked) + '</span></button>').join('') + '</div>').join('') + '</div>' + en(ex.pattern.en);
      actions = next; break; }
    case 'patternCard':
      body = '<div class="pattern-card"><div class="pc-badge">💡 Patrón</div><div class="pc-text">' + esc(ex.pattern.card) + '</div>' + (S.settings.help ? '<div class="en">' + esc(ex.pattern.en) + '</div>' : '') + '</div>';
      actions = next; break;
    case 'dialogue': {
      const d = ex.dialogue;
      body = (d.scene ? '<div class="scene">' + esc(d.scene) + '</div>' : '') + '<div class="chat">' + d.lines.map((l, i) => { const c = SL.CAST[l.who] || { name: l.who, pic: '🙂' }; const right = l.who !== d.lines[0].who;
        return '<button class="bubble-row' + (right ? ' right' : '') + '" data-act="sayLine" data-arg="' + i + '" id="ln' + i + '"><span class="who">' + c.pic + '<small>' + esc(c.name) + '</small></span><span class="bubble">' + esc(l.es) + en(l.en) + '</span></button>'; }).join('') + '</div>';
      actions = '<button class="btn secondary" data-act="playAll">' + uiBtn('▶ Escuchar todo', 'Listen to all') + '</button>' + next; break; }
    case 'reply': {
      const rp = ex.reply, c = SL.CAST[rp.who] || { name: rp.who, pic: '🙂' };
      body = (rp.pic ? '<div class="hero-card slim">' + R_(rp.pic, 'hero sm') + '</div>' : '') + '<div class="chat"><div class="bubble-row"><span class="who">' + c.pic + '<small>' + esc(c.name) + '</small></span><span class="bubble">' + esc(rp.prompt) + en(rp.en) + '</span></div></div>' + audioBtns() +
        '<div class="opts">' + ex.options.map((o, i) => '<button class="opt' + (E.used.indexOf(i) >= 0 ? ' soft' : '') + (E.done && i === ex.answer ? ' good' : '') + '" data-act="chooseOpt" data-arg="' + i + '"' + (E.done || E.used.indexOf(i) >= 0 ? ' disabled' : '') + '>🧒 ' + esc(o) + '</button>').join('') + '</div>';
      actions = E.done ? next : ''; break; }
  }
  let coach = '';
  if (ex.type === 'intro') {
    const p = me();
    if (p && !p.seenIntroTip) {
      coach = '<div class="coach-tip" id="coachTip"><span>💡 Escucha 🔊 y toca Siguiente ▶' + (S.settings.help ? '<div class="en">Listen, then tap Next.</div>' : '') + '</span><button class="coach-x" data-act="dismissTip" aria-label="dismiss">✕</button></div>';
    }
  }
  render(topbar(R.title, 'quitRun', true) + '<div class="screen lesson ex-' + ex.type + '">' + progressHTML() +
    '<div class="instr"><span class="ii">' + ins[0] + '</span> ' + uiInstr(ins[1], ins[2]) + (ex.review ? ' <span class="tag">🔁 repaso</span>' : '') + (ex.retry ? ' <span class="tag">otra vez</span>' : '') + '</div>' +
    '<div class="stage">' + body + '</div><div class="fb" id="fb">' + (fb || '') + '</div>' + coach + '<div class="actions">' + actions + '</div></div>', true);
}
function setFb(html) { const f = document.getElementById('fb'); if (f) f.innerHTML = html; }
function cheer() { return '<div class="fb-good">🌟 ' + pick(CHEERS) + '</div>'; }

/* answer handling */
function correct(extra) {
  E.done = true; Speech.chime(true);
  finishGraded(E.tries === 0);
  renderEx(cheer() + (extra || ''));
}
function wrong(i, msg) {
  E.tries++; if (i !== undefined && E.used.indexOf(i) < 0) E.used.push(i);
  Speech.chime(false);
  if (E.tries === 1 && E.ex.graded) queueRetry();
  renderEx('<div class="fb-soft">💜 ' + (msg || pick(SOFT)) + '</div>');
}
function queueRetry() {
  const key = (E.ex.item && E.ex.item.es) + '|' + E.ex.type;
  if (R.kind === 'placement' || R.retried.has(key)) return;
  const r = SL.retryOf(E.ex, SL.rng(Date.now())); if (!r) return;
  R.retried.add(key); R.queue.push(r);
}
function finishGraded(firstTry) {
  const ex = E.ex, p = me(), d = day(p);
  if (!ex.graded) return;
  if (!ex.retry) {
    R.results.push({ graded: true, firstTry, type: ex.type, es: ex.item && ex.item.es });
    d.items++; if (firstTry) d.ok++;
  }
  const es = ex.item && ex.item.es;
  if (R.kind !== 'placement' && es && SL.itemsByEs[es] && !R.srsDone.has(es) && !ex.retry) { R.srsDone.add(es); p.cards[es] = SL.srsUpdate(p.cards[es], firstTry, today()); }
  if (R.kind === 'lesson' && p.active) p.active.results = R.results;
  save();
}
ACT.choose = (i, el) => {
  if (E.done) return; i = +i;
  if (i === E.ex.answer) { if (E.ex.type === 'read' || E.ex.type === 'pick') Speech.say(E.ex.item.say); return correct(); }
  if (E.ex.type === 'listen') { wrong(i, 'Escucha otra vez. 🎧'); Speech.say(E.ex.item.say); } else wrong(i);
  if (E.tries >= 3) { E.done = true; renderEx('<div class="fb-info">👉 ' + esc(E.ex.item.es) + '</div>'); }
};
ACT.chooseOpt = i => {
  if (E.done) return; i = +i; const ex = E.ex;
  if (ex.type === 'reply') Speech.say(ex.options[i]);
  if (i === ex.answer) { if (ex.type === 'fill') Speech.say(ex.say); return correct(); }
  wrong(i);
  if (E.tries >= 2 && ex.options.length - E.used.length <= 1) { E.done = true; renderEx('<div class="fb-info">👉 ' + esc(ex.type === 'fill' ? ex.item.es : ex.reply.answer) + '</div>'); }
};
/* speaking */
ACT.mic = () => {
  if (E.listening) return;
  E.listening = true; renderEx('<div class="fb-info">👂 …</div>');
  Speech.listen(res => {
    E.listening = false;
    if (!res.ok) {
      if (Speech.srBroken()) return renderEx('<div class="fb-info">🎤 El micrófono no está disponible. Dilo en voz alta y toca 👍.' + en('Speech recognition is not available here. Say it out loud, then tap 👍.') + '</div>');
      E.tries++; return renderEx('<div class="fb-soft">💜 No te oí bien. ¡Otra vez!</div>');
    }
    const m = SL.speechMatch(res.alts, E.ex.item.es);
    if (m.pass) { E.done = true; Speech.chime(true); R.results.push({ graded: false, type: 'speak', spoke: true }); renderEx('<div class="fb-good">🌟 ' + pick(CHEERS) + ' <span class="heard">“' + esc(m.heard) + '”</span></div>'); }
    else { E.tries++; renderEx('<div class="fb-soft">💜 Casi. Oí: <span class="heard">“' + esc(res.alts[0] || '') + '”</span>. Escucha 🔊 y prueba otra vez.</div>'); }
  });
};
ACT.saidIt = () => { if (E.done) return; E.done = true; R.results.push({ graded: false, type: 'speak' }); renderEx(cheer()); };
/* spelling */
ACT.tile = i => { i = +i; if (E.done || E.used.indexOf(i) >= 0 || E.typed.length >= E.ex.target.length) return; E.used.push(i); E.typed.push(E.ex.tiles[i]); E.typedSrc = (E.typedSrc || []).concat([i]); E.bad = null; renderEx(); };
ACT.acc = c => { if (E.done || E.typed.length >= E.ex.target.length) return; E.typed.push(c); E.typedSrc = (E.typedSrc || []).concat([-1]); E.bad = null; renderEx(); };
ACT.del = () => { if (E.done || !E.typed.length) return; E.typed.pop(); const src = (E.typedSrc || []).pop(); if (src >= 0) E.used.splice(E.used.indexOf(src), 1); E.bad = null; renderEx(); };
ACT.checkSpell = () => {
  const ex = E.ex, typed = E.typed.join('');
  if (typed === ex.target) return correct('<div class="es">' + esc(ex.item.es) + '</div>');
  E.bad = ex.target.split('').map((c, i) => (E.typed[i] !== c ? i : -1)).filter(i => i >= 0);
  const accentOnly = SL.norm(typed) === SL.norm(ex.target) && typed.length === ex.target.length;
  E.tries++; Speech.chime(false);
  if (E.tries === 1) queueRetry();
  if (E.tries >= 3) { E.done = true; E.typed = ex.target.split(''); E.bad = null; Speech.say(ex.say); return renderEx('<div class="fb-info">👉 ' + esc(ex.item.es) + '</div>'); }
  renderEx('<div class="fb-soft">💜 ' + (accentOnly ? '¡Casi! Mira los acentos. ✍️' : 'Casi. Las letras naranjas no están bien. Toca ⌫ y prueba otra vez.') + '</div>');
};
/* sentence builder */
ACT.place = i => { i = +i; if (E.done || E.placed.indexOf(i) >= 0) return; E.placed.push(i); renderEx(); };
ACT.unplace = k => { if (E.done) return; E.placed.splice(+k, 1); renderEx(); };
ACT.checkBuild = () => {
  const ex = E.ex, toks = E.placed.map(i => ex.tiles[i]);
  if (SL.checkBuild(ex, toks)) { Speech.say(ex.say); return correct(); }
  E.tries++; Speech.chime(false);
  if (E.tries === 1) queueRetry();
  if (E.tries >= 3) { E.done = true; Speech.say(ex.say); return renderEx('<div class="fb-info">👉 ' + esc(ex.item.es) + '</div>'); }
  const good = toks.findIndex((t, k) => t !== ex.tokens[k]);
  renderEx('<div class="fb-soft">💜 Casi. ' + (good > 0 ? 'Las primeras ' + good + ' palabras están bien. ' : '') + 'Escucha 🔊 y prueba otra vez.</div>');
};
/* dialogue */
ACT.sayLine = i => { const l = E.ex.dialogue.lines[+i]; markLine(+i); Speech.say(l.es, { pitch: (SL.CAST[l.who] || {}).pitch || 1 }); };
ACT.playAll = () => { const d = E.ex.dialogue; Speech.sayLines(d.lines.map(l => ({ text: l.es, pitch: (SL.CAST[l.who] || {}).pitch || 1 })), markLine, () => markLine(-1)); };
function markLine(i) { document.querySelectorAll('.bubble-row').forEach((b, k) => b.classList.toggle('speaking', k === i)); }

ACT.next = () => {
  if (E && !E.done && E.ex.graded) return;
  if (E && ['intro', 'patternShow', 'patternCard', 'dialogue'].indexOf(E.ex.type) >= 0) R.results.push({ graded: false, type: E.ex.type });
  R.qi++;
  if (R.qi >= R.queue.length) return endSet();
  showEx();
};
ACT.quitRun = () => {
  modal('<h2>¿Salir?</h2><p>Your progress is saved at the end of each part.</p><button class="btn" data-act="closeModal">Seguir aquí</button><button class="btn ghost" data-act="reallyQuit">Salir al mapa</button>');
};
ACT.reallyQuit = () => { Speech.stop(); R = null; goHub(); };
function endSet() {
  R.si++;
  const p = me();
  if (R.kind === 'lesson') { p.active = { lid: R.L.id, seed: p.active ? p.active.seed : 0, si: R.si, results: R.results }; save(); }
  if (R.si >= R.sets.length) return endRun();

}
function setBreak(resuming) {
  const nxt = R.sets[R.si], sc = SL.scoreResults(R.results);

    '<div class="setlist">' + R.sets.map((s, i) => '<span class="setpill' + (i < R.si ? ' done' : i === R.si ? ' now' : '') + '">' + s.icon + ' ' + esc(s.name) + '</span>').join('') + '</div>' +
    '<div class="actions"><button class="btn" data-act="startSet">' + nxt.icon + ' ' + esc(nxt.name) + ' ▶</button></div></div>';

ACT.startSet = () => startSet();
function gentleStop() {
  goalPending = false;
  const p = me();
  modal('<div class="celebrate-emoji">🌟</div><h2>¡10 minutos! ¡Buen trabajo!</h2><p>Racha: <b>' + streak(p) + ' día' + (streak(p) === 1 ? '' : 's') + '</b> 🔥<br><span class="muted">Your spot is saved. See you tomorrow!</span></p>' +
    '<button class="btn" data-act="doneForToday">Terminar por hoy 🌙</button><button class="btn ghost" data-act="closeModal">Un poquito más</button>');
}
ACT.doneForToday = () => { closeModal(); Speech.stop(); R = null; goHub(); };
function endRun() {
  const p = me(), d = day(p);
  if (R.kind === 'placement') return placementDone();
  if (R.kind === 'review') {
    const then = R.then, sc = SL.scoreResults(R.results);
    render(topbar('🔁 Repaso', 'hub', true) + '<div class="screen center"><div class="celebrate-emoji">🔁</div><h1>¡Repaso listo!</h1><p class="muted">⭐ ' + sc.firstOk + ' / ' + sc.graded + '</p><div class="actions"><button class="btn" data-act="afterReview">Lección ▶</button></div></div>', true);
    ACT.afterReview = () => then ? then() : goHub();
    if (goalPending) gentleStop();
    return;
  }
  const L = R.L, sc = SL.scoreResults(R.results), prev = p.lessons[L.id] || {};
  const wasDone = !!prev.done;
  p.lessons[L.id] = { done: wasDone || sc.pass, stars: Math.max(prev.stars || 0, sc.stars), best: Math.max(prev.best || 0, Math.round(sc.pct * 100)), attempts: (prev.attempts || 0) + 1, last: today() };
  p.active = null;
  if (d.lessons.indexOf(L.id) < 0) d.lessons.push(L.id);
  save();
  const nextL = SL.lessons[L.flat + 1];
  const unitDone = sc.pass && SL.unitByN[L.unit].lessons.every(x => SL.lessonDone(p, x)) && !wasDone;
  let msg;
  if (sc.pass) msg = unitDone ? '🏆 ¡Unidad ' + L.unit + ' completa!' + (nextL ? ' 🔓 Unidad ' + nextL.unit + ': ' + esc(SL.unitByN[nextL.unit].title) : '') : (nextL && !wasDone ? '🔓 ¡Nueva lección! ' + esc(nextL.title) : '¡Qué bien!');
  else msg = 'To open the next lesson, play this one again and get 4 out of 5 right on the first try. ¡Tú puedes!';
  const stars = sc.pass ? sc.stars : 0;
  const conf = sc.pass ? '<div class="confetti">' + Array.from({ length: 28 }, (_, i) => '<span style="left:' + ((i * 37) % 100) + '%;animation-delay:' + ((i % 7) * 0.18).toFixed(2) + 's;font-size:' + (22 + (i % 4) * 8) + 'px">' + ['🎉', '⭐', '🌟', '✨', '🎊', '💫'][i % 6] + '</span>').join('') + '</div>' : '';
  const timeLeft = SESSION_GOAL_SEC - d.sec;
  render(topbar(L.icon + ' ' + esc(L.title), 'hub', false) + conf + '<div class="screen center celebrate"><div class="celebrate-emoji">' + (sc.pass ? (unitDone ? '🏆' : '🎉') : '🌱') + '</div>' +
    '<h1>' + (sc.pass ? '¡Lección completa!' : '¡Buen trabajo!') + '</h1>' +
    '<div class="stars">' + [0, 1, 2].map(i => '<span class="' + (i < stars ? 'on' : '') + '" style="animation-delay:' + (0.3 + i * 0.25) + 's">★</span>').join('') + '</div>' +
    '<p>' + sc.firstOk + ' / ' + sc.graded + ' a la primera (' + Math.round(sc.pct * 100) + '%)</p><p class="unlock">' + msg + '</p>' +
    (S.settings.help ? '<p class="en">Can-do: ' + esc(L.goal) + '</p>' : '') +
    '<div class="actions">' + (sc.pass ? (timeLeft > 60 && nextL ? '<button class="btn" data-act="openLesson" data-arg="' + nextL.id + '">Siguiente lección ▶</button>' : '<button class="btn" data-act="hub">Terminar por hoy 🌙</button>')
      : '<button class="btn" data-act="openLesson" data-arg="' + L.id + '">Otra vez 🔁</button>') + '<button class="btn secondary" data-act="hub">🗺️ Mapa</button></div></div>', false);
  if (sc.pass) Speech.say(pick(['¡Muy bien!', '¡Excelente trabajo!', '¡Felicidades!']));
}

  render('<div class="topbar"><button class="btn secondary small" data-act="' + (S.current ? 'hub' : 'home') + '">◀</button><div class="title">👪 Grown-ups</div></div><div class="screen parent-view">' +
    '<div class="card"><div class="row"><button class="btn secondary small" data-act="setting" data-arg="help">' + (S.settings.help ? '✅' : '⬜') + ' Grown-up help (show English in lessons)</button>' +
    '<button class="btn secondary small" data-act="setting" data-arg="mic">' + (S.settings.mic ? '✅' : '⬜') + ' Use microphone for speaking' + (Speech.hasSR() ? '' : ' (not available on this browser)') + '</button>' +
    '<button class="btn secondary small" data-act="rate">🐇 Voice speed: ' + (S.settings.rate >= 0.95 ? 'normal' : S.settings.rate >= 0.8 ? 'a bit slower' : 'slow') + '</button>' +
    '<button class="btn secondary small" data-act="testVoice">🔊 Test voice</button></div><p class="muted" style="font-size:17px">' + voiceInfo + '</p>' +
    '<p class="muted" style="font-size:17px">Mastery rule: the next lesson unlocks after about 80% first-try accuracy in a lesson. Missed words come back in review after 1, 2, 4, 7, 14 and 30 days. Everything is stored only on this iPad.</p></div>' + html + '</div>', false);
}
ACT.parent = goParent;
ACT.setting = k => { S.settings[k] = !S.settings[k]; if (k === 'mic') Speech.resetSR(); save(); goParent(); };
ACT.rate = () => { const opts = [1.0, 0.85, 0.7]; const i = opts.indexOf(S.settings.rate); S.settings.rate = opts[(i + 1) % opts.length]; Speech.setRate(S.settings.rate); save(); goParent(); };
ACT.testVoice = () => Speech.say('¡Hola! El gato es verde.');
ACT.toggle = arg => { const [id, key] = arg.split(':'); const p = S.players.find(x => x.id === id); p[key] = !p[key]; p.setupDone = true; save(); goParent(); };
ACT.cycleUiEn = id => { const p = S.players.find(x => x.id === id); const opts = ['auto', 'always', 'never']; p.uiEn = opts[(opts.indexOf(p.uiEn || 'auto') + 1) % opts.length]; save(); goParent(); };
ACT.cycleHow = id => {
  const p = S.players.find(x => x.id === id);
  // cycle: auto → always → never(hide) → auto
  if (p.hideHow || p.howWorks === 'never') { p.hideHow = false; p.howWorks = 'auto'; }
  else if ((p.howWorks || 'auto') === 'auto') { p.howWorks = 'always'; }
  else { p.howWorks = 'never'; p.hideHow = true; }
  save(); goParent();
};
ACT.setStartU = arg => { const [id, dlt] = arg.split(':'); const p = S.players.find(x => x.id === id); const maxU = Math.max(...SL.lessons.map(L => L.unit));
  const u = Math.max(1, Math.min(maxU, p.startUnit + +dlt)); setStart(p, u); goParent(); };
ACT.resetP = id => { const p = S.players.find(x => x.id === id); modal('<h2>Reset ' + esc(p.name) + '?</h2><p>This erases all progress for this player on this iPad.</p><button class="btn" data-act="resetYes" data-arg="' + id + '">Yes, reset</button><button class="btn ghost" data-act="closeModal">Cancel</button>'); };
ACT.resetYes = id => { const i = S.players.findIndex(x => x.id === id), old = S.players[i]; S.players[i] = mkPlayer(old.id, old.name, old.color); save(); closeModal(); goParent(); };

/* ---------------- ABOUT ---------------- */
ACT.about = () => render(topbar('About', 'home') + '<div class="screen"><div class="idea"><h2>' + APP_NAME + ' · Spanish Lab</h2>' +
  '<p>A private family app for learning Spanish, 10 minutes a day. No accounts, no ads, no tracking. Progress stays on this iPad.</p><br>' +
  '<p><b>Which Spanish?</b> Latin American Spanish (Mexican/U.S. usage): <i>el carro, la computadora, el jugo, el plátano, el pizarrón, ¿Me prestas…?</i> The voice prefers a Mexico or U.S. Spanish voice.</p><br>' +
  '<p><b>How it teaches:</b> pictures instead of translations, then words → phrases → sentences → short conversations. Grammar is discovered from patterns, with a one-line pattern card. Words you miss come back later (spaced review).</p><br>' +
  '<p><b>Sound:</b> uses the iPad\'s built-in Spanish voice. If it sounds English or silent, add a Spanish voice: Settings → Accessibility → Spoken Content → Voices → Spanish → Spanish (Mexico). Make sure the ringer/volume is up.</p><br>' +
  '<p><b>Speaking:</b> when the browser supports it, tap 🎤 and speak (this uses Apple\'s speech service and may ask for microphone permission). Otherwise just say it out loud and tap 👍. Speaking never blocks progress.</p><br>' +
  '<p class="muted">All lessons, pictures and wording are original. This app is not affiliated with any language-learning company.</p></div></div>');

/* ---------------- boot ---------------- */
Speech.setRate(S.settings.rate);
if (location.protocol.indexOf('http') === 0 && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
window.PAP = { S, SL, goHome, goHub, goParent, ACT, openLesson, startRun, save, uiFlags, uiBtn, uiInstr, get R() { return R; }, get E() { return E; }, renderEx: f => renderEx(f) }; // for testing
S.current && me() && me().setupDone ? goHub() : goHome();
})();

</script>
</body>
</html>
